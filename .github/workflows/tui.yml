name: tui

on:
  push:
    branches: [main]
    paths: ['apps/tui/**', 'build-tui*.sh', 'package.json', '.github/workflows/tui.yml', 'eslint.config.js']
  pull_request:
    branches: [main]
    paths: ['apps/tui/**', 'build-tui*.sh', 'package.json', '.github/workflows/tui.yml', 'eslint.config.js']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/tui/package-lock.json
      - run: npm ci --prefix apps/tui --ignore-scripts
      - run: npm run test:tui
      - run: npm run build:tui
      - run: npm run build:tui:deb
      - uses: actions/upload-artifact@v7
        with:
          name: dsh-launcher-tui
          path: |
            build/tui/*.tgz
            build/tui/*.deb
          if-no-files-found: error
