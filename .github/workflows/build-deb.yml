name: build-deb

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    # Зафиксировано: ubuntu-latest 19.10.2026 переезжает на Ubuntu 26.
    # После миграции можно сменить на ubuntu-26.04 (сборка просто копирует
    # бинарник Electron, от версии ОС раннера она не зависит).
    runs-on: ubuntu-24.04
    permissions:
      contents: write # создание Release при теге
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download Electron binary
        # Electron 44+ не скачивает бинарник из postinstall — только вручную
        run: npx install-electron

      - name: Build .deb
        run: ./build-deb.sh

      - name: Check version consistency
        run: |
          want=$(sed -n 's/^Version: //p' deb/control)
          if [ ! -f "dsh-launcher_${want}_amd64.deb" ]; then
            echo "::error::Расхождение версий: в deb/control 'Version: $want', а скрипт собрал: $(ls dsh-launcher_*_amd64.deb). Поменяйте REV в build-deb.sh и Version в deb/control синхронно."
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: dsh-launcher-deb
          path: dsh-launcher_*_amd64.deb
          if-no-files-found: error

      - name: Publish GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dsh-launcher_*_amd64.deb
          generate_release_notes: true
