name: build-deb

# Как выпустить релиз:
#   1. Дописать раздел `## [Unreleased]` в CHANGELOG.md (русский) и
#      CHANGELOG.en.md (английский) — оба станут описанием релиза.
#   2. (по желанию) Actions → docker-tests → Run workflow: сценарии
#      установленного пакета на Ubuntu 24.04 / 26.04 и Debian 13 (~15 минут).
#   3. npm run release X.Y.Z — раздел становится `## [X.Y.Z] — <дата>`,
#      версия — в package.json, package-lock.json и deb/control; коммит
#      «Версия X.Y.Z» и тег vX.Y.Z (локально).
#   4. git push origin main vX.Y.Z
# Тег vX.Y.Z даёт пакет X.Y.Z-1; тег vX.Y.Z-R — пакет X.Y.Z-R (перепаковка
# той же версии). Version: в deb/control для релиза переписывается из тега.
#
# Пуш в main (кроме правок *.md) — только сборка: .deb в артефактах прогона,
# без релиза. PR — тоже только сборка и тесты: это pull_request, не
# pull_request_target, так что у PR из форка токен только на чтение и нет
# секретов, а первый PR нового участника GitHub запускает лишь после
# одобрения владельцем.
on:
  push:
    branches: [main]
    tags: ['v*']
    # Для пушей тегов фильтр путей не применяется — только для веток.
    paths-ignore: ['**.md']
  # PR (в том числе от Dependabot): юнит-тесты, ESLint и сборка пакета; релиз
  # выходит только по тегу
  pull_request:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза, напр. v1.1.0. Пусто = просто сборка без релиза'
        required: false
        type: string

jobs:
  build:
    # Зафиксировано: ubuntu-latest 19.10.2026 переезжает на Ubuntu 26.
    # После миграции можно сменить на ubuntu-26.04 (сборка просто копирует
    # бинарник Electron, от версии ОС раннера она не зависит).
    runs-on: ubuntu-24.04
    permissions:
      contents: write # создание Release (и тега — при ручном запуске)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # история и теги — для поиска предыдущего релиза

      - name: Determine version
        # - пуш тега v*: релиз этого тега;
        # - ручной запуск с полем «Тег релиза»: релиз с этим тегом (если тега
        #   ещё нет — его создаст акция на текущем коммите);
        # - пуш в main / ручной запуск без поля: только сборка, версия из
        #   deb/control.
        id: ver
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -eu
          tag=""
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ -n "${DISPATCH_TAG:-}" ]; then
            tag="$DISPATCH_TAG"
            case "$tag" in v*) ;; *) tag="v$tag" ;; esac
            # Существующий тег должен указывать на собираемый коммит — иначе
            # к релизу приложился бы пакет из другого кода.
            if sha=$(git rev-parse -q --verify "refs/tags/$tag^{commit}"); then
              [ "$sha" = "$GITHUB_SHA" ] || {
                echo "::error::Тег $tag уже есть и указывает на ${sha:0:7}, а собирается ${GITHUB_SHA:0:7}. Запустите воркфлоу на нужном коммите или возьмите новый тег."
                exit 1; }
            fi
          fi

          if [ -n "$tag" ]; then
            v="${tag#v}"
            if echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              ver="$v-1"
            elif echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$'; then
              ver="$v"
            else
              echo "::error::Тег '$tag' не в формате vX.Y.Z или vX.Y.Z-R"
              exit 1
            fi
            sed -i "s/^Version: .*/Version: $ver/" deb/control
            echo "deb/control: Version -> $ver"
            releasing=true
          else
            ver=$(sed -n 's/^Version: *//p' deb/control)
            releasing=false
            echo "Только сборка (без релиза), версия: $ver"
          fi
          echo "$ver" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$' || {
            echo "::error::Версия '$ver' не в формате X.Y.Z-R (напр. 1.1.0-1)"
            exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "releasing=$releasing" >> "$GITHUB_OUTPUT"

      - name: Release notes
        # Описание релиза — раздел версии из CHANGELOG.md (русский) и
        # CHANGELOG.en.md (английский), через разделитель. В каждом файле
        # ищется сначала `## [X.Y.Z-R]` (как в теге), затем `## [X.Y.Z]`.
        # Нет английского — релиз выйдет с одним русским (с предупреждением);
        # нет ни одного — список коммитов с предыдущего тега v*.
        # В конце — ссылка на полное сравнение.
        if: steps.ver.outputs.releasing == 'true'
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -eu
          v="${TAG#v}"
          section() { # section <файл> <версия>
            [ -f "$1" ] || return 0
            awk -v h="## [$2]" '
              index($0, h) == 1 { on = 1; next }
              on && /^## / { exit }
              on { print }
            ' "$1" | sed -e '/./,$!d' # без пустых строк в начале
          }
          notes_for() { # notes_for <файл>
            n=$(section "$1" "$v")
            [ -n "$n" ] || n=$(section "$1" "${v%-*}")
            printf '%s' "$n"
          }
          ru=$(notes_for CHANGELOG.md)
          en=$(notes_for CHANGELOG.en.md)
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_SHA^" 2>/dev/null || true)
          {
            if [ -n "$ru" ] && [ -n "$en" ]; then
              printf '## Русский\n\n%s\n\n---\n\n## English\n\n%s\n' "$ru" "$en"
            elif [ -n "$ru$en" ]; then
              echo "::warning::Раздел [$v] есть только в одном из CHANGELOG.md / CHANGELOG.en.md" >&2
              printf '%s\n' "$ru$en"
            else
              echo "::warning::В CHANGELOG нет раздела [$v] — в описание пойдёт список коммитов" >&2
              if [ -n "$prev" ]; then range="$prev..$GITHUB_SHA"; else range="$GITHUB_SHA"; fi
              git log --no-merges --format='- %s' "$range"
            fi
            if [ -n "$prev" ]; then
              printf '\n**Full Changelog**: %s/%s/compare/%s...%s\n' \
                "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$prev" "$TAG"
            fi
          } > release-notes.md
          cat release-notes.md

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        # Сравнение версий и поиск pid по порту (test/*.js). Упавший тест
        # останавливает сборку — пакет и релиз не выйдут.
        run: npm test

      - name: Unit test coverage
        # Отчёт о покрытии модулей, которые тесты подключают напрямую (функции
        # в блоках-маркеров проверяет test/markers.js) — во вкладку Summary.
        run: |
          {
            echo '### Покрытие юнит-тестами'
            echo '```'
            npm run -s coverage 2>&1 | sed -n '/start of coverage report/,/end of coverage report/p' | sed 's/^ℹ //'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download Electron binary
        # Electron 44+ не скачивает бинарник из postinstall — только вручную
        run: npx install-electron

      - name: Build .deb
        run: ./build-deb.sh

      - name: Upload artifact
        # v5 всё ещё node20; node24 появился с v6, берём актуальный major
        uses: actions/upload-artifact@v7
        with:
          name: dsh-launcher-deb
          path: dsh-launcher_*_amd64.deb
          if-no-files-found: error

      - name: Publish GitHub Release
        # success() по умолчанию и так применяется к условию (статусных
        # функций в нём нет), но пишем явно: Release публикуется только
        # после того, как все шаги выше завершились успешно.
        if: success() && steps.ver.outputs.releasing == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          # Если тега ещё нет (ручной запуск) — акция создаст его на собранном коммите
          target_commitish: ${{ github.sha }}
          files: dsh-launcher_*_amd64.deb
          body_path: release-notes.md
          make_latest: true
