name: build-deb

on:
  push:
    branches: [main]
    tags: ['v*']
  # PR (в т.ч. из форков) тоже получают сборку — required-чек 'build'
  # из branch protection обязан что-то проверять. Для pull_request
  # releasing всегда false (не тег и нет поля dispatch), а токен у
  # форк-PR read-only: наружный PR не может ни опубликовать Release,
  # ни изменить репозиторий.
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза, напр. v1.0.0-10. Пусто = просто сборка без релиза'
        required: false
        type: string

jobs:
  build:
    # Зафиксировано: ubuntu-latest 19.10.2026 переезжает на Ubuntu 26.
    # После миграции можно сменить на ubuntu-26.04 (сборка просто копирует
    # бинарник Electron, от версии ОС раннера она не зависит).
    runs-on: ubuntu-24.04
    permissions:
      contents: write # создание Release при теге
    steps:
      - uses: actions/checkout@v5

      - name: Determine version
        # Порядок источников версии: тег события -> поле Run workflow -> deb/control.
        # Для релиза тег ПЕРЕОПРЕДЕЛЯЕТ deb/control в рабочей копии.
        id: ver
        env:
          EVENT_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$EVENT_TAG" ]; then
            ver="${EVENT_TAG#v}"; releasing=true
          elif [ -n "$DISPATCH_TAG" ]; then
            ver="${DISPATCH_TAG#v}"; releasing=true
          else
            ver=$(sed -n 's/^Version: *//p' deb/control); releasing=false
          fi
          echo "$ver" | grep -Eq '^[0-9]+(\.[0-9]+)+-[0-9]+$' || {
            echo "::error::Версия '$ver' не в формате X.Y.Z-R (напр. 1.0.0-10)"
            exit 1; }
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "releasing=$releasing" >> "$GITHUB_OUTPUT"
          if [ "$releasing" = true ]; then
            sed -i "s/^Version: .*/Version: $ver/" deb/control
            echo "deb/control: Version -> $ver (из тега)"
          else
            # Пуш в main: подсказать, какой тег сделать следующим
            last=$(git ls-remote --tags origin 'v*' --refs | sed 's|.*refs/tags/||; s/^v//' \
              | grep -E '^[0-9]+(\.[0-9]+)+-[0-9]+$' | sed 's/.*-//' | sort -n | tail -1 || true)
            if [ -n "${last:-}" ]; then
              echo "💡 Следующий релиз-тег: v${ver%-*}-$((last + 1))"
            fi
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download Electron binary
        # Electron 44+ не скачивает бинарник из postinstall — только вручную
        run: npx install-electron

      - name: Build .deb
        run: ./build-deb.sh

      - name: Upload artifact
        # v5 всё ещё node20; node24 появился с v6, берём актуальный major
        uses: actions/upload-artifact@v7
        with:
          name: dsh-launcher-deb
          path: dsh-launcher_*_amd64.deb
          if-no-files-found: error

      - name: Publish GitHub Release
        if: steps.ver.outputs.releasing == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          # Если тега ещё нет (кнопка Run workflow) — акция создаст его
          # именно на собранном коммите
          target_commitish: ${{ github.sha }}
          files: dsh-launcher_*_amd64.deb
          generate_release_notes: true
