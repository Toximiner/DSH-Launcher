name: build-deb

on:
  push:
    branches: [main]
  # Триггера pull_request НЕТ намеренно: репозиторий публичный, и любой
  # форк-PR запускал бы сборку (минуты/очередь CI) и, что важнее, код
  # стороннего автора выполнялся бы в джобе (npm ci из чужого
  # package.json). Код из PR проверяется вручную (diff) или локальной
  # сборкой ./build-deb.sh. Ручные сборки кода из main — кнопка
  # Run workflow ниже. В терминале v* теги создавать не нужно — тег
  # создаёт сам CI после зелёной сборки в main (тег-триггер снят,
  # иначе собственные теги CI повторно запускали бы воркфлоу).
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза, напр. v1.0.0-12. Пусто = просто сборка без релиза'
        required: false
        type: string

jobs:
  build:
    # Зафиксировано: ubuntu-latest 19.10.2026 переезжает на Ubuntu 26.
    # После миграции можно сменить на ubuntu-26.04 (сборка просто копирует
    # бинарник Electron, от версии ОС раннера она не зависит).
    runs-on: ubuntu-24.04
    permissions:
      contents: write # сам CI создаёт релиз-тег и Release
    steps:
      - uses: actions/checkout@v5

      - name: Determine version
        # - пуш в main: АВТОРЕЛИЗ — база X.Y из Version: в deb/control,
        #   ревизия = следующая свободная после существующих тегов
        #   v<база>-*.
        # - dispatch с полем «Тег релиза»: релиз с этой версией (тег
        #   создаст сама акция, если его ещё нет).
        # - dispatch без поля: только сборка, версия из deb/control.
        # Для релиза версия переписывается в deb/control рабочей копии —
        # имя .deb из build-deb.sh совпадает с релизом.
        id: ver
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -eu
          ver=$(sed -n 's/^Version: *//p' deb/control)
          releasing=false
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch)
              if [ -n "${DISPATCH_TAG:-}" ]; then
                ver="${DISPATCH_TAG#v}"
                releasing=true
              fi
              ;;
            push)
              # Авто-релиз: база X.Y — из deb/control
              base=${ver%-*}
              base_re=$(printf '%s' "$base" | sed 's/\./\\./g')
              # максимальная ревизия среди тегов v<база>-* (пусто, если нет)
              last=$(git ls-remote --tags origin 'v*' --refs \
                | sed 's|.*refs/tags/v||' \
                | grep -E '^[0-9]+(\.[0-9]+)+-[0-9]+$' \
                | grep -E "^${base_re}-[0-9]+$" \
                | sed 's/.*-//' | sort -n | tail -1 || true)
              rev=$(( ${last:-0} + 1 ))
              # Повторный запуск после сбоя релиза: максимальный тег мог
              # уже указывать на этот коммит (прошлый запуск успел его
              # создать) — тогда не инкрементим, а переиспользуем.
              if [ -n "${last:-}" ]; then
                sha=$(git ls-remote origin "refs/tags/v$base-$last" | awk '{print $1}' || true)
                if [ "$sha" = "$GITHUB_SHA" ]; then rev=$last; fi
              fi
              # Если же кандидат занят ЧУЖИМ коммитом — берём следующую
              # свободную ревизию.
              while :; do
                cand="$base-$rev"
                sha=$(git ls-remote origin "refs/tags/v$cand" | awk '{print $1}' || true)
                if [ -z "$sha" ]; then
                  ver="$cand"
                  break
                fi
                if [ "$sha" = "$GITHUB_SHA" ]; then
                  ver="$cand"
                  echo "Тег v$cand уже существует и указывает на этот коммит — обновляю релиз"
                  break
                fi
                rev=$((rev + 1))
              done
              releasing=true
              ;;
          esac
          echo "$ver" | grep -Eq '^[0-9]+(\.[0-9]+)+-[0-9]+$' || {
            echo "::error::Версия '$ver' не в формате X.Y.Z-R (напр. 1.0.0-10)"
            exit 1; }
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "releasing=$releasing" >> "$GITHUB_OUTPUT"
          if [ "$releasing" = true ]; then
            sed -i "s/^Version: .*/Version: $ver/" deb/control
            echo "deb/control: Version -> $ver"
          else
            echo "Только сборка (без релиза), версия: $ver"
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download Electron binary
        # Electron 44+ не скачивает бинарник из postinstall — только вручную
        run: npx install-electron

      - name: Build .deb
        run: ./build-deb.sh

      - name: Upload artifact
        # v5 всё ещё node20; node24 появился с v6, берём актуальный major
        uses: actions/upload-artifact@v7
        with:
          name: dsh-launcher-deb
          path: dsh-launcher_*_amd64.deb
          if-no-files-found: error

      - name: Publish GitHub Release
        # success() по умолчанию и так применяется к условию (статусных
        # функций в нём нет), но пишем явно: Release публикуется только
        # после того, как все шаги выше завершились успешно.
        if: success() && steps.ver.outputs.releasing == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          # Если тега ещё нет — акция создаст его на собранном коммите
          target_commitish: ${{ github.sha }}
          files: dsh-launcher_*_amd64.deb
          generate_release_notes: true
