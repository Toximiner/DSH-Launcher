name: build-deb

# How to make a release:
#   1. Complete the `## [Unreleased]` section in CHANGELOG.md (Russian) and
#      CHANGELOG.en.md (English) — both become the release description.
#   2. (optional) Actions → docker-tests → Run workflow: scenarios of the
#      installed package on Ubuntu 24.04 / 26.04 and Debian 13 (~15 minutes).
#   3. npm run release X.Y.Z — the section becomes `## [X.Y.Z] — <date>`,
#      the version — in package.json, package-lock.json and deb/control; a
#      «Version X.Y.Z» commit (the tag is not created — applied after the merged PR).
#   4. Direct push to main is closed by the «Changes must be made through a
#      pull request» rule — the release goes through a PR:
#        git push origin main:release/X.Y.Z
#        gh pr create --base main --head release/X.Y.Z
#      (other people's PRs, e.g. dependabot — 1 approval from the owner;
#      their own PR the owner merges themselves — enforce_admins is off),
#      on green build — merge (regular merge commit).
#   5. git fetch origin
#      git tag vX.Y.Z origin/main && git push origin vX.Y.Z
# Tag vX.Y.Z gives package X.Y.Z-1; tag vX.Y.Z-R — package X.Y.Z-R (a repack
# of the same version). Version: in deb/control is rewritten from the tag.
#
# Push to main (except *.md edits) — build only: the .deb in the run's
# artifacts, no release. PR — build and tests only too: this is
# pull_request, not pull_request_target, so a PR from a fork has a
# read-only token and no secrets, and a new contributor's first PR GitHub
# runs only after approval by the owner.
on:
  push:
    branches: [main]
    tags: ['v*']
    # The paths filter does not apply to tag pushes — only to branches.
    paths-ignore: ['**.md']
  # PR (including from Dependabot): unit tests, ESLint and package build; a
  # release happens only on a tag
  pull_request:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза, напр. v1.1.0. Пусто = просто сборка без релиза'
        required: false
        type: string

jobs:
  build:
    # Pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19.
    # After the migration it can be changed to ubuntu-26.04 (the build just
    # copies the Electron binary, it does not depend on the runner OS version).
    runs-on: ubuntu-24.04
    permissions:
      contents: write # creating the Release (and the tag — on manual run)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # history and tags — for finding the previous release

      - name: Determine version
        # - push of a v* tag: release of that tag;
        # - manual run with the «Тег релиза» field: release with that tag (if
        #   the tag does not exist yet — the action creates it on the commit);
        # - push to main / manual run without the field: build only, version
        #   from deb/control.
        id: ver
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -eu
          tag=""
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ -n "${DISPATCH_TAG:-}" ]; then
            tag="$DISPATCH_TAG"
            case "$tag" in v*) ;; *) tag="v$tag" ;; esac
            # An existing tag must point to the commit being built — otherwise
            # the release would attach a package from different code.
            if sha=$(git rev-parse -q --verify "refs/tags/$tag^{commit}"); then
              [ "$sha" = "$GITHUB_SHA" ] || {
                echo "::error::Тег $tag уже есть и указывает на ${sha:0:7}, а собирается ${GITHUB_SHA:0:7}. Запустите воркфлоу на нужном коммите или возьмите новый тег."
                exit 1; }
            fi
          fi

          if [ -n "$tag" ]; then
            v="${tag#v}"
            if echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              ver="$v-1"
            elif echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$'; then
              ver="$v"
            else
              echo "::error::Тег '$tag' не в формате vX.Y.Z или vX.Y.Z-R"
              exit 1
            fi
            sed -i "s/^Version: .*/Version: $ver/" deb/control
            echo "deb/control: Version -> $ver"
            releasing=true
          else
            ver=$(sed -n 's/^Version: *//p' deb/control)
            releasing=false
            echo "Только сборка (без релиза), версия: $ver"
          fi
          echo "$ver" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$' || {
            echo "::error::Версия '$ver' не в формате X.Y.Z-R (напр. 1.1.0-1)"
            exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "releasing=$releasing" >> "$GITHUB_OUTPUT"

      - name: Release notes
        # Release description — the version section from CHANGELOG.md (Russian)
        # and CHANGELOG.en.md (English), separated by a divider. In each file
        # `## [X.Y.Z-R]` (as in the tag) is looked up first, then `## [X.Y.Z]`.
        # No English — the release goes out with Russian only (with a warning);
        # none at all — the commit list since the previous v* tag.
        # At the end — a link to the full comparison.
        if: steps.ver.outputs.releasing == 'true'
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -eu
          v="${TAG#v}"
          section() { # section <file> <version>
            [ -f "$1" ] || return 0
            awk -v h="## [$2]" '
              index($0, h) == 1 { on = 1; next }
              on && /^## / { exit }
              # service HTML comment ([Unreleased] placeholder) — not into the description
              on && $0 ~ /^<!--/ && $0 ~ /-->$/ { next }
              on { print }
            ' "$1" | sed -e '/./,$!d' # no blank lines at the start
          }
          notes_for() { # notes_for <file>
            n=$(section "$1" "$v")
            [ -n "$n" ] || n=$(section "$1" "${v%-*}")
            printf '%s' "$n"
          }
          ru=$(notes_for CHANGELOG.md)
          en=$(notes_for CHANGELOG.en.md)
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_SHA^" 2>/dev/null || true)
          {
            if [ -n "$ru" ] && [ -n "$en" ]; then
              printf '## Русский\n\n%s\n\n---\n\n## English\n\n%s\n' "$ru" "$en"
            elif [ -n "$ru$en" ]; then
              echo "::warning::Раздел [$v] есть только в одном из CHANGELOG.md / CHANGELOG.en.md" >&2
              printf '%s\n' "$ru$en"
            else
              echo "::warning::В CHANGELOG нет раздела [$v] — в описание пойдёт список коммитов" >&2
              if [ -n "$prev" ]; then range="$prev..$GITHUB_SHA"; else range="$GITHUB_SHA"; fi
              git log --no-merges --format='- %s' "$range"
            fi
            if [ -n "$prev" ]; then
              printf '\n**Full Changelog**: %s/%s/compare/%s...%s\n' \
                "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$prev" "$TAG"
            fi
          } > release-notes.md
          cat release-notes.md

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        # Version comparison and pid lookup by port (test/*.js). A failing
        # test stops the build — the package and the release will not go out.
        run: npm test

      - name: Unit test coverage
        # Coverage report for the modules the tests include directly (the
        # functions in marker blocks are checked by test/markers.js) — into
        # the Summary tab. The thresholds (--test-coverage-*) are set in
        # package.json: coverage below them — the step fails, no build.
        run: |
          npm run -s coverage > coverage-report.txt 2>&1 || { cat coverage-report.txt; exit 1; }
          {
            echo '### Покрытие юнит-тестами'
            echo '```'
            sed -n '/start of coverage report/,/end of coverage report/p' coverage-report.txt | sed 's/^ℹ //'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download Electron binary
        # Electron 44+ no longer downloads the binary in postinstall — manually only
        run: npx install-electron

      - name: Build .deb
        run: ./build-deb.sh

      - name: Checksums
        # SHA256SUMS — for manual installation; the launcher's self-update
        # cross-checks the digest of the .deb from the GitHub API with the file.
        run: sha256sum dsh-launcher_*_amd64.deb > SHA256SUMS

      - name: Upload artifact
        # v5 is still node20; node24 appeared with v6 — taking the current major
        uses: actions/upload-artifact@v7
        with:
          name: dsh-launcher-deb
          path: |
            dsh-launcher_*_amd64.deb
            SHA256SUMS
          if-no-files-found: error

      - name: Publish GitHub Release
        # success() is applied to the condition by default anyway (it has no
        # status functions in it), but we write it explicitly: the Release is
        # published only after all steps above finished successfully.
        if: success() && steps.ver.outputs.releasing == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          # If the tag does not exist yet (manual run) — the action creates it on the built commit
          target_commitish: ${{ github.sha }}
          files: |
            dsh-launcher_*_amd64.deb
            SHA256SUMS
          body_path: release-notes.md
          make_latest: true
