name: docker-tests

# Scenarios for the installed .deb in Docker on clean Ubuntu 24.04 / 26.04
# and Debian 13 (test/docker/run.sh): window closing and signals, an
# "adopted" dsh, updating dsh via npm and the launcher itself via pkexec,
# menus, search, proxy, etc.
#
# Each system — a separate job on its own machine (matrix), all in
# parallel: the run takes ~10–15 minutes. Unit tests — once, in the plan job.
#
# Manual runs only, and the scenarios go to the network — npm, nodejs.org
# and (proxy scenario only) the GitHub API, with the run's token. Launcher
# releases for update/rollback scenarios — a fake GitHub (test/docker/fakes/github.py).
on:
  workflow_dispatch:
    inputs:
      oses:
        description: 'Системы через пробел: версия Ubuntu (24.04) или debian-<версия> (debian-13)'
        required: false
        default: '24.04 26.04 debian-13'
        type: string
      scenarios:
        description: 'Сценарии через пробел (пусто = все, см. test/docker/run.sh)'
        required: false
        default: ''
        type: string

jobs:
  # Unit tests and the list of systems for the matrix: the line
  # "24.04 26.04 debian-13" → a JSON array.
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      oses: ${{ steps.oses.outputs.oses }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Systems
        id: oses
        env:
          OSES: ${{ inputs.oses }}
        run: |
          set -eu
          json=$(printf '%s' "$OSES" | jq -R -c 'split(" ") | map(select(length > 0))')
          [ "$json" != "[]" ] || { echo "::error::Список систем пуст"; exit 1; }
          echo "oses=$json" >> "$GITHUB_OUTPUT"
          echo "Системы: $json"

  docker:
    needs: plan
    name: docker (${{ matrix.os }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false # a failure on one system does not stop the others
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.oses) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download Electron binary
        run: npx install-electron

      # Docker image layer cache in GitHub Actions (run.sh: DOCKER_GHA_CACHE):
      # buildx and access to the Actions cache for `docker buildx build`.
      - uses: docker/setup-buildx-action@v4
      - uses: crazy-max/ghaction-github-runtime@v4

      - name: Docker scenarios
        env:
          DOCKER_GHA_CACHE: '1'
          OSES: ${{ matrix.os }}
          SCENARIOS: ${{ inputs.scenarios }}
          JOBS: '4'
          # run.sh learns the latest release via the GitHub API — with a token free of the 60/h limit
          GITHUB_TOKEN: ${{ github.token }}
        # $SCENARIOS unquoted — the scenario list as separate arguments
        run: test/docker/run.sh $SCENARIOS

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docker-test-logs-${{ matrix.os }}
          # results/ — logs, JUnit, coverage.txt; coverage/ — the HTML coverage report
          path: |
            test/docker/.work/results/
            test/docker/.work/coverage/
          if-no-files-found: ignore
