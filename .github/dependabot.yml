# Dependabot: once a week — a PR with new dependency versions (Electron
# first: its patch releases carry Chromium security fixes) and of GitHub
# Actions. The PR is checked by build-deb (unit tests, ESLint, build); the
# Docker scenarios run manually (Actions → docker-tests).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      eslint:
        patterns: ['eslint', '@eslint/*', 'globals']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
